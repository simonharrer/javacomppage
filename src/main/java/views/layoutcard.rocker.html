@import com.bycomparison.Category
@import java.util.List

@args (String title, String category, List
<Category> categories, String previewCard, RockerBody content)

    <!DOCTYPE html>
    <html lang="en">
    <head>
        <title>@title</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.20.0/themes/prism.min.css">
        <link rel="stylesheet"
              href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.20.0/plugins/line-highlight/prism-line-highlight.min.css">

        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:site" content="@@simonharrer">
        <meta name="twitter:creator" content="@@simonharrer">
        <meta name="twitter:title" content="@title">
        <meta name="twitter:description" content="@title">
        <meta name="twitter:image" content="@previewCard">
    </head>
    <body>

    <style>
        .token.operator,
        .token.entity,
        .token.url,
        .language-css .token.string,
        .style .token.string {
            color: #9a6e3a;
            background: none;
        }

        pre[data-line] {
            padding-left: 1em !important;
        }

        .comparison-before,.comparison-before > pre {
            background-color: #efd2d2 !important
        }
        .comparison-after,.comparison-after > pre {
            background-color: #d2efd2 !important
        }
        .line-highlight[data-end]:after,.line-highlight[data-end]:before,.line-highlight:before,.line-highlight:after {
            content: unset;
        }

    </style>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <!-- <a class="navbar-brand" href="index.html">Code by Comparison</a> -->
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavDropdown"
                    aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav">
                    <li class="nav-item @if ("method".equals(category)) {active}">
                    <a class="nav-link" href="method.html">Method</a>
                    </li>
                    <li class="nav-item"><hr style="width:2em;"/></li>
                    @for(c : categories) {
                    <li class="nav-item @if (c.name().equals(category)) {active}">
                        <a class="nav-link" href="@c.link()">@c.name() @if (c.name().equals(category)) { by Comparison
                            }</a>
                    </li>
                    }
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-3">
        @content
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@@4.5.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx" crossorigin="anonymous"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.20.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.20.0/components/prism-java.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.20.0/components/prism-diff.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.20.0/plugins/diff-highlight/prism-diff-highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.20.0/plugins/line-highlight/prism-line-highlight.min.js"></script>

    <script data-mode="hash" async defer src="https://cdn.simpleanalytics.io/hello.js"></script>
    <noscript><img src="https://api.simpleanalytics.io/hello.gif" alt=""></noscript>
    </body>
    </html>
