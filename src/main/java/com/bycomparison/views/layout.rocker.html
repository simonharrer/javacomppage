@args (String title, String category, RockerBody content)

<html lang="en">
<head>
    <title>@title</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.20.0/themes/prism.min.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.20.0/plugins/line-highlight/prism-line-highlight.min.css">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@@simonharrer">
    <meta name="twitter:creator" content="@@simonharrer">
    <meta name="twitter:title" content="@title">
    <meta name="twitter:description" content="@title">
    <meta name="twitter:image" content="https://java.by-comparison.com/cover.jpg">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="https://java.by-comparison.com">Things by Comparison</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavDropdown"
                aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
            <ul class="navbar-nav">
                <li class="nav-item @if (category.equals("Java")) {active}">
                    <a class="nav-link" href="https://java.by-comparison.com/java">Java</a>
                </li>
                <li class="nav-item @if (category.equals("Java Concurrency")) {active}">
                    <a class="nav-link" href="https://java.by-comparison.com/java-concurrency">Java Concurrency</a>
                </li>
                <li class="nav-item @if (category.equals("Spring Boot")) {active}">
                    <a class="nav-link" href="https://java.by-comparison.com/spring-boot">Spring Boot</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-3">
    @content
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.20.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.20.0/components/prism-java.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.20.0/plugins/line-highlight/prism-line-highlight.min.js"></script>

<script data-mode="hash" async defer src="https://cdn.simpleanalytics.io/hello.js"></script>
<noscript><img src="https://api.simpleanalytics.io/hello.gif" alt=""></noscript>
</body>
</html>
